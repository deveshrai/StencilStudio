    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7aa35a"/><stop offset="1" stop-color="#4c7a3a"/></linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f7f3c"/><stop offset="1" stop-color="#2d5226"/></linearGradient>
