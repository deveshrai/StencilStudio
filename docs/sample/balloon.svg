    <linearGradient id="stripeY" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d79a12"/><stop offset="0.5" stop-color="#ffd03a"/><stop offset="1" stop-color="#c88a0c"/></linearGradient>
    <clipPath id="env"><path d="M600 120 C 470 120 400 220 400 330 C 400 440 500 520 560 600 L 640 600 C 700 520 800 440 800 330 C 800 220 730 120 600 120 Z"/></clipPath>
