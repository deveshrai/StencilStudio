  <path d="M0 640 C 180 560 330 590 470 620 C 640 655 760 560 930 575 C 1050 585 1130 620 1200 610 L1200 900 L0 900 Z" fill="url(#hill1)"/>
  <path d="M0 720 C 160 660 300 700 430 720 C 600 745 720 670 880 690 C 1010 705 1110 740 1200 730 L1200 900 L0 900 Z" fill="url(#hill2)"/>
