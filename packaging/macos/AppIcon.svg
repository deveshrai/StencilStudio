      <stop offset="0" stop-color="#2d3140"/>
      <stop offset="1" stop-color="#16181f"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- three offset stencil layers -->
  <rect x="236" y="236" width="400" height="400" rx="48" fill="#f6c800"/>
  <rect x="312" y="312" width="400" height="400" rx="48" fill="#c8231e"/>
