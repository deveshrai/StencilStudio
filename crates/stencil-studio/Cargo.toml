[package]
name = "stencil-studio"
version.workspace = true
edition.workspace = true

[lib]
name = "stencil_studio"
# rlib for the desktop binary, cdylib for the Android APK.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "stencil-studio"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
slint = "1.19"
stencil-core = { version = "0.1.0", path = "../stencil-core" }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.18"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.19", features = ["backend-android-activity-06"] }
jni = "=0.21.1"
log = "0.4"
android_logger = "0.15"

[build-dependencies]
slint-build = "1.19"

# ---------------------------------------------------------------------------
# Android packaging (cargo apk2 build --lib -p stencil-studio)
# ---------------------------------------------------------------------------
[package.metadata.android]
package = "io.github.deveshrai.stencilstudio"
apk_name = "StencilStudio"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "android/res"
strip = "strip"
include_cplusplus_shared = true

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 35

[package.metadata.android.application]
label = "StencilStudio"
icon = "@mipmap/ic_launcher"
theme = "@style/AppTheme"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|density|uiMode"
launch_mode = "singleTask"
window_soft_input_mode = "adjustResize"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "stencil_studio"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

# Read photos to open them (Android 13+ / older versions).
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

# Write exports to Documents/StencilStudio on Android 9 and below.
[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 28
